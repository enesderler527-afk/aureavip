<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield Pro - Güvenlik Portalı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0d1117, #010409);
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Cam Temalı Kart Container */
        .card {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #58a6ff;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 25px;
        }

        /* Input ve Butonlar */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #3fb950;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 160, 67, 0.4);
        }

        /* Sayaç ve Log Alanı */
        .status-box {
            display: none;
            margin-top: 20px;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 700;
            color: #f85149;
            margin: 15px 0;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(248, 81, 73, 0.4);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #21262d;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #f85149;
            transition: width 1s linear;
        }

        .logs {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            height: 120px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            text-align: left;
            overflow-y: auto;
            color: #8b949e;
        }

        .log-entry {
            margin-bottom: 4px;
        }
        .log-entry.success { color: #3fb950; }
        .log-entry.warn { color: #d29922; }
        .log-entry.danger { color: #f85149; }

        /* Son Ekran */
        .final-message {
            display: none;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #3fb950;
            padding: 20px;
            background: rgba(63, 185, 80, 0.1);
            border: 1px solid #2ea043;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>CYBERSHIELD PRO</h1>
    <p class="subtitle">Sistem Analiz ve Temizleme Portalı</p>

    <!-- Aşama 1: Numara Giriş Ekrani -->
    <div id="step-input" class="input-group">
        <input type="text" id="user-number" placeholder="Telefon veya Kimlik No Giriniz" autocomplete="off">
        <button onclick="startSimulation()">SİSTEMİ TARAVE TEMİZLE</button>
    </div>

    <!-- Aşama 2 ve 3: Sayaç ve Konsol -->
    <div id="step-status" class="status-box">
        <div id="status-title" style="color: #8b949e; font-weight: 500;">Taramalar Başlatılıyor...</div>
        <div id="timer" class="timer-display">30</div>
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="logs" class="logs"></div>
    </div>

    <!-- Aşama 4: Bitiş Ekrani -->
    <div id="final-screen" class="final-message">
        virüsler Kaspersky saklandı
    </div>
</div>

<script>
    let currentTimer = null;

    function addLog(text, type = '') {
        const logsDiv = document.getElementById('logs');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
        logsDiv.appendChild(entry);
        logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    function startSimulation() {
        const input = document.getElementById('user-number').value;
        if (!input) {
            alert("Lütfen geçerli bir numara girin!");
            return;
        }

        // Giriş alanını gizle, durumu göster
        document.getElementById('step-input').style.display = 'none';
        document.getElementById('step-status').style.display = 'block';

        // 1. Aşama: 30 Saniye Hacker Temizliği & Program Silme
        runPhaseOne();
    }

    function runPhaseOne() {
        let timeLeft = 30;
        let progCount = 100;
        const timerEl = document.getElementById('timer');
        const fillEl = document.getElementById('progress-fill');
        const titleEl = document.getElementById('status-title');

        titleEl.textContent = "Hacker Saldırıları ve Zararlı Yazılımlar Temizleniyor...";
        addLog("Ağ tespiti yapılıyor...", "warn");
        addLog("Tespit Edilen Hacker Bağlantıları: 14", "danger");

        // 30 saniye boyunca 100 programın silinmesini simüle eden zamanlayıcılar
        const programInterval = setInterval(() => {
            if (progCount > 0) {
                // Rastgele isimli program silme simülasyonu
                addLog(`Program kaldırıldı: sys_cache_pkg_${progCount}.exe`, "danger");
                progCount--;
            }
        }, 280); // ~30 saniyede 100 tane bitirmek için

        currentTimer = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;
            fillEl.style.width = ((30 - timeLeft) / 30 * 100) + "%";

            if (timeLeft === 20) {
                addLog("Bütün aktif hacker oturumları devre dışı bırakıldı!", "success");
            }
            if (timeLeft === 10) {
                addLog("Son sistem kalıntıları temizleniyor...", "warn");
            }

            if (timeLeft <= 0) {
                clearInterval(currentTimer);
                clearInterval(programInterval);
                addLog("1. Aşama Tamamlandı. Sistem arındırıldı.", "success");
                
                // 2. Aşamaya Geç (30 Saniyelik İkinci Sayaç)
                setTimeout(runPhaseTwo, 1500);
            }
        }, 1000);
    }

    function runPhaseTwo() {
        let timeLeft = 30;
        const timerEl = document.getElementById('timer');
        const fillEl = document.getElementById('progress-fill');
        const titleEl = document.getElementById('status-title');

        // Ekran ve Renk Güncellemeleri
        titleEl.textContent = "Derin Güvenlik Karantina İşlemi...";
        timerEl.style.color = "#d29922";
        fillEl.style.background = "#d29922";
        fillEl.style.width = "0%";

        addLog("Kaspersky Veri Tabanı Entegrasyonu Başlatılıyor...", "warn");

        currentTimer = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;
            fillEl.style.width = ((30 - timeLeft) / 30 * 100) + "%";

            if (timeLeft % 5 === 0 && timeLeft > 0) {
                addLog(`Şüpheli virüs blokları Kaspersky karantinasına aktarılıyor... (%${Math.round((30-timeLeft)/30*100)})`);
            }

            if (timeLeft <= 0) {
                clearInterval(currentTimer);
                // Son Aşamayı Göster
                document.getElementById('step-status').style.display = 'none';
                document.getElementById('final-screen').style.display = 'block';
            }
        }, 1000);
    }
</script>

</body>
</html>
